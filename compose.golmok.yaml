name: golmok-one-week

services:
  backend:
    build:
      context: ./golmok-one-week/backend
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./golmok-one-week/frontend
      args:
        # 빈 값이면 Caddy가 같은 도메인의 /api 요청을 백엔드로 전달한다.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    depends_on:
      - backend
    expose:
      - "3000"
    restart: unless-stopped

  gateway:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./golmok-one-week/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
