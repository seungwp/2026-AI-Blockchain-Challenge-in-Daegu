# MySQL 전환용 프로필: --spring.profiles.active=mysql
spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/golmok?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${MYSQL_USER:golmok}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
