spring:
  application:
    name: golmok-one-week
  # 저장소 루트 .env 를 읽어 API 키를 채운다 (IntelliJ 실행처럼 환경변수를 안 넘겨도 동작하게).
  # 작업 폴더가 backend 일 때 기준이며, 파일이 없으면 무시한다. 실제 환경변수가 있으면 그쪽이 우선한다.
  config:
    import: optional:file:../../.env[.properties]
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

golmok:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  keys:
    data-go-kr: ${DATA_GO_KR_KEY:}
    kamis-cert-key: ${KAMIS_CERT_KEY:}
    kamis-cert-id: ${KAMIS_CERT_ID:}
    groq-api-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:openai/gpt-oss-120b}
    juso-search-api-key: ${JUSO_SEARCH_API_KEY:}
  # 외부 API 키는 환경변수로만 주입 (코드·yml에 직접 쓰지 않음)
  providers:
    weather: kma       # kma(기상청) | mock(예시 값)
    festival: mock     # mock = DbFestivalProvider (H2 시드 실데이터, 대체 구현 없음)
    holiday: kasi      # kasi(천문연) | mock(명절 없음)
    store-search: mock # mock = DbStoreSearchProvider (H2 시드 실데이터, 대체 구현 없음)

---
# 실제 API 연동 시 사용할 키 자리 (값은 환경변수)
spring:
  config:
    activate:
      on-profile: local
golmok:
  keys:
    data-go-kr: ${DATA_GO_KR_KEY:}
    kamis-cert-key: ${KAMIS_CERT_KEY:}
    kamis-cert-id: ${KAMIS_CERT_ID:}
    groq-api-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:openai/gpt-oss-120b}
