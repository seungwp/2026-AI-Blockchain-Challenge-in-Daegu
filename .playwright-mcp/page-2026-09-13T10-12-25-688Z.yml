                  - generic [ref=f3e200]:
                    - paragraph [ref=f3e201]: 대구광역시 인허가 데이터 190종 데이터 개방합니다.
                    - paragraph [ref=f3e202]: 인허가 정보를 수집하여 국민경제활동에 도움을 줄 수 있는 다양한 인허가 정보를 제공합니다.
                    - paragraph [ref=f3e203]: 기타_미디어, 담배, 물류, 민방위, 상조, 엘리베이터, 전문교육기관, 사무지원 업소 정보
                    - paragraph [ref=f3e204]: "미디어 : 광고물, 인쇄, 출판을 전문으로 하는 업소정보 옥외광고업, 인쇄사, 출판사"
                    - paragraph [ref=f3e205]: "담배 : 담배를 제조업자에게 매입하거나 또는 수입하여 도ㆍ소매로 판매하는 업소정보 담배도매업, 담배소매업, 담배수입판매업체"
                    - paragraph [ref=f3e206]: "물류 : 화물의 물류를 주선하거나 유통 및 판매의 목적으로 직접 보관 또는 창고를 대여하는 업소정보 물류주선업(국제), 물류창고업체"
                    - paragraph [ref=f3e207]:
                      - strong [ref=f3e208]: "민방위 : 민방위사태 발생 시 대피시설 또는 비상급수 시설 정보 민방위급수시설, 민방위대피시설"
                    - paragraph [ref=f3e209]: "상조 : 장례 등 상호간 공조를 목적으로 선불식 방식으로 회원을 모집하여 운영하는 전문 업소 상조업"
                    - paragraph [ref=f3e210]: "엘리베이터 : 승강기 제조, 수입, 점검, 수리 업소정보 승강기유지관리업체, 승강기제조및수입업체"
                    - paragraph [ref=f3e211]: "전문교육기관 : 요양보호, 간병, 장례등 전문적인 자격을 취득을 목적으로 설치된 교육기관 정보 요양보호사교육기관, 장례지도사 교육기관"
                    - paragraph [ref=f3e212]: "사무지원 : 구인자와 구직자 간에 고용 알선 및 행정서류 등의 작성 및 제출을 대행하는 업소 정보 무료직업소개소, 유료직업소개소, 행정사업"
                    - paragraph [ref=f3e213]: "[출처 : 한국지역정보개발원]"
